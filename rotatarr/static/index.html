<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotatarr</title>
  <link rel="icon" href="/static/favicon.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="/static/icon.png" alt="" width="44" height="44">
      <div>
        <h1>Rotatarr</h1>
        <p class="tagline" data-t="tagline"></p>
      </div>
    </div>
    <nav>
      <button data-tab="status" data-t="tab_status"></button>
      <button data-tab="libraries" data-t="tab_libraries"></button>
      <button data-tab="settings" data-t="tab_settings"></button>
      <button data-tab="connection" data-t="tab_connection"></button>
    </nav>
    <div class="header-end">
      <span id="air-pill" class="air-pill" hidden></span>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>

  <main>
    <div id="notice"></div>

    <section id="tab-status" hidden>
      <div class="card not-connected" hidden>
        <p data-t="not_connected"></p>
        <button class="primary" data-goto="connection" data-t="go_connection"></button>
      </div>
      <p id="dry-run-banner" class="warn" data-t="dry_run_active" hidden></p>
      <div class="hero">
        <div class="card countdown-card">
          <div class="eyebrow" data-t="next_change_in"></div>
          <div id="countdown" class="countdown">--:--:--</div>
          <div class="bars">
            <div class="progress" id="progress-rotate">
              <div class="progress-label"><span data-t="kind_rotate"></span><span class="progress-times"></span></div>
              <div class="progress-track"><div class="progress-fill"></div></div>
            </div>
            <div class="progress" id="progress-shuffle">
              <div class="progress-label"><span data-t="kind_shuffle"></span><span class="progress-times"></span></div>
              <div class="progress-track"><div class="progress-fill"></div></div>
            </div>
          </div>
          <div class="actions">
            <button class="primary" data-run="rotate" data-t="run_rotate"></button>
            <button data-run="shuffle" data-t="run_shuffle"></button>
          </div>
        </div>
        <div id="overview" class="tiles"></div>
      </div>
      <div class="section-head">
        <h2 data-t="on_air"></h2>
        <div class="section-tools">
          <button type="button" class="link-button" id="on-air-toggle" data-expand="on-air" hidden></button>
          <div id="rows-library" class="segmented" role="group" data-t-label="library"></div>
        </div>
      </div>
      <div id="on-air" class="posters"></div>
      <div class="split">
        <div class="guide-col">
          <h2 data-t="current_rows"></h2>
          <p class="muted" data-t="rows_hint"></p>
          <div class="guide-scroll"><div id="guide" class="guide"></div></div>
          <button type="button" class="more" data-expand="guide" hidden></button>
        </div>
        <aside class="card log">
          <h2 data-t="log"></h2>
          <div id="history"></div>
          <button type="button" class="more" data-expand="history" hidden></button>
        </aside>
      </div>
    </section>

    <section id="tab-libraries" hidden>
      <div class="card not-connected" hidden>
        <p data-t="not_connected"></p>
        <button class="primary" data-goto="connection" data-t="go_connection"></button>
      </div>
      <div class="card" id="library-picker">
        <label><span data-t="library"></span>
          <select id="library-select"></select>
        </label>
      </div>
      <form id="library-form" class="card" hidden>
        <label class="check"><input type="checkbox" name="enabled"> <span data-t="enabled"></span></label>

        <h3 data-t="visible_rows"></h3>
        <div class="grid3">
          <label><span data-t="recommended"></span><input type="number" min="0" name="recommended"></label>
          <label><span data-t="home"></span><input type="number" min="0" name="home"></label>
          <label><span data-t="shared"></span><input type="number" min="0" name="shared"></label>
        </div>
        <p class="muted" data-t="counts_hint"></p>

        <h3 data-t="which_collections"></h3>
        <p class="pool-summary" id="pool-summary"></p>
        <p class="muted" data-t="collections_hint"></p>
        <input type="search" id="collection-filter" data-t-placeholder="collections_filter">
        <table class="collections">
          <tbody id="collections"></tbody>
        </table>

        <details id="advanced-rules" open>
          <summary data-t="advanced_rules"></summary>
          <label><span data-t="min_items"></span><input type="number" min="0" name="min_items"></label>
          <p class="muted" data-t="min_items_hint"></p>
          <label><span data-t="exclude"></span><textarea name="exclude" rows="2"></textarea></label>
          <p class="muted" data-t="exclude_hint"></p>
          <div class="field">
            <span class="field-label" data-t="quotas"></span>
            <p class="muted" data-t="quotas_hint"></p>
            <div id="quota-rows"></div>
            <button type="button" id="add-quota" data-t="quota_add"></button>
          </div>
          <div class="field" id="automatic-field" hidden>
            <div class="grid2">
              <label><span data-t="automatic_max"></span><input type="number" min="0" name="automatic_max" data-t-placeholder="no_limit"></label>
              <label><span data-t="automatic_max_home"></span><input type="number" min="0" name="automatic_max_home" data-t-placeholder="no_limit"></label>
            </div>
            <p class="muted" id="automatic-hint"></p>
          </div>
        </details>

        <h3 data-t="shuffle_title"></h3>
        <label class="check"><input type="checkbox" name="shuffle_order"> <span data-t="shuffle_order"></span></label>
        <label class="check"><input type="checkbox" name="shuffle_items"> <span data-t="shuffle_items"></span></label>

        <div class="form-save"><button class="primary" type="submit" data-t="save"></button></div>
      </form>
    </section>

    <section id="tab-settings" hidden>
      <form id="settings-form" class="card">
        <label><span data-t="rotation_interval"></span><input type="number" min="0" name="rotation_interval_minutes"></label>
        <label><span data-t="shuffle_interval"></span><input type="number" min="0" name="shuffle_interval_minutes"></label>
        <p class="muted" data-t="interval_hint"></p>
        <label><span data-t="items_to_front"></span><input type="number" min="1" name="items_to_front"></label>
        <div class="field">
          <span class="field-label" data-t="pinned_rows"></span>
          <p class="muted" data-t="pinned_hint"></p>
          <ul id="pinned-list" class="pinned"></ul>
          <label class="check"><input type="checkbox" name="pinned_everywhere"> <span data-t="pinned_everywhere"></span></label>
        </div>
        <label><span data-t="repeat_block"></span><input type="number" min="0" name="repeat_block_runs"></label>
        <p class="muted" data-t="repeat_block_hint"></p>
        <label class="check"><input type="checkbox" name="dry_run"> <span data-t="dry_run"></span></label>
        <h3 data-t="notify_title"></h3>
        <label><span data-t="discord_webhook"></span><input type="url" name="discord_webhook" placeholder="https://discord.com/api/webhooks/…" autocomplete="off"></label>
        <p class="muted" data-t="discord_hint"></p>
        <label class="check"><input type="checkbox" name="notify_success"> <span data-t="notify_success"></span></label>
        <button type="button" id="notify-test" data-t="notify_test"></button>
        <button class="primary" type="submit" data-t="save"></button>
      </form>
      <div class="card danger" id="reset-card">
        <h2 data-t="reset_title"></h2>
        <p class="muted" data-t="reset_hint"></p>
        <button type="button" id="reset" data-t="reset_button"></button>
      </div>
      <div class="card notes">
        <p data-t="kometa_note"></p>
        <p data-t="smart_note"></p>
      </div>
    </section>

    <section id="tab-connection" hidden>
      <div class="card" id="connected-card" hidden>
        <p><span data-t="connected_to"></span> <strong id="connected-url"></strong></p>
        <button id="disconnect" data-t="disconnect"></button>
      </div>
      <div class="card">
        <button class="primary" id="plex-login" data-t="sign_in_plex"></button>
        <p id="plex-wait" class="muted" data-t="waiting_plex" hidden></p>
        <div id="servers" hidden>
          <h2 data-t="choose_server"></h2>
          <ul id="server-list"></ul>
        </div>
      </div>
      <form id="manual-form" class="card">
        <h2 data-t="manual"></h2>
        <label><span data-t="url"></span><input name="url" placeholder="http://192.168.1.10:32400" required></label>
        <label><span data-t="token"></span><input name="token" type="password" required></label>
        <button type="submit" data-t="connect"></button>
      </form>
    </section>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
