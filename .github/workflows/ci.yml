name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"  # weekly rebuild of latest, picks up security fixes in the base image

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Tag matches the version in the code
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(python -c 'import rotatarr; print(rotatarr.__version__)')" = "$GITHUB_REF_NAME"

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rotatarr:smoke .
      - name: Start the container and check the web UI answers
        run: |
          mkdir config && sudo chown root:root config
          docker run -d --name rotatarr -p 7373:7373 -v "$PWD/config:/config" rotatarr:smoke
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:7373/api/state && break; sleep 1; done
          curl -fs http://127.0.0.1:7373/api/settings
          test "$(stat -c %u:%g config/settings.json)" = "99:100"
          docker top rotatarr | grep -v root | grep -q rotatarr
          docker exec rotatarr python -m rotatarr.healthcheck
      - if: failure()
        run: docker logs rotatarr

  docker:
    needs: smoke
    if: github.event_name == 'push' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rotatarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release with the changes since the last tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
